[project]
name = "aiops-workspace"
version = "1.2.0"
description = "AIOps PoC: MCP-сервер с векторным поиском Qdrant и Ollama"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2.0.0",
    "qdrant-client>=1.7.0",
    "ollama>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]